name: Deploy MindKid to Cloudflare Free (Stage 1)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mindkid-cloudflare-prod
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Gate Check, Terraform Sync, D1 Migrate & Atomic Deploy
    runs-on: ubuntu-latest
    env:
      MINDKID_RUNTIME: cloudflare
      STORAGE_DRIVER: d1-blobs
      QUEUE_DRIVER: cloudflare-do
      AUTH_STORE_DRIVER: do
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm & Node.js
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # vue-tsc đọc .nuxt/tsconfig.*.json; nuxt.config nhập env.ts nên cần env giả (chỉ để sinh type, không build).
      - name: Generate .nuxt tsconfig (web, admin) for vue-tsc
        env:
          NUXT_PUBLIC_API_BASE_URL: "https://example.com"
        run: |
          cp apps/web/.env.example apps/web/.env
          pnpm --filter @mindkid/web exec nuxt prepare
          rm apps/web/.env
          pnpm --filter @mindkid/admin exec nuxt prepare

      - name: Gate 1 - Static Typecheck, Lint & Dependency Boundaries
        run: pnpm check

      - name: Gate 2 - Setup Terraform & Provision Edge Shield / D1
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform Init & Apply (Cloudflare Free Shield + 3 D1 DBs)
        working-directory: infra/cloudflare
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain: ${{ vars.MINDKID_DOMAIN }}
          TF_VAR_backend_mode: "cloudflare"
        run: |
          terraform init
          terraform apply -auto-approve
          terraform output -json > ../../.tf-outputs.json

      # BR-ENV-18: wrangler deploy ghi đè vars dashboard -> biến KHÔNG bí mật phải nằm trong wrangler.jsonc.
      # Biến bí mật không vào đây; đặt một lần bằng `wrangler secret put` (xem release-deploy.md).
      - name: Sync D1 Database IDs & runtime vars into wrangler.jsonc & Export D1 DDL
        env:
          SITE_URL: "https://${{ vars.MINDKID_DOMAIN }}"
          NUXT_ALLOWED_ORIGINS: "https://${{ vars.MINDKID_DOMAIN }},https://admin.${{ vars.MINDKID_DOMAIN }}"
          STORAGE_BASE_URL: "https://${{ vars.MINDKID_DOMAIN }}"
          PAYMENT_MODE: ${{ vars.PAYMENT_MODE }}
          PAYMENT_MERCHANT_ID: ${{ vars.PAYMENT_MERCHANT_ID }}
          PAYMENT_PAYOS_MERCHANT_ID: ${{ vars.PAYMENT_PAYOS_MERCHANT_ID }}
          PAYMENT_VNPAY_MERCHANT_ID: ${{ vars.PAYMENT_VNPAY_MERCHANT_ID }}
          PAYMENT_MOMO_MERCHANT_ID: ${{ vars.PAYMENT_MOMO_MERCHANT_ID }}
          VIETQR_BANK_ID: ${{ vars.VIETQR_BANK_ID }}
          VIETQR_BANK_NAME: ${{ vars.VIETQR_BANK_NAME }}
          VIETQR_ACCOUNT_NO: ${{ vars.VIETQR_ACCOUNT_NO }}
          VIETQR_ACCOUNT_NAME: ${{ vars.VIETQR_ACCOUNT_NAME }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          OPERATIONS_ALERT_EMAIL: ${{ vars.OPERATIONS_ALERT_EMAIL }}
          HEALTHCHECKS_CHECK_UUID: ${{ vars.HEALTHCHECKS_CHECK_UUID }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          CLIENT_ERROR_SAMPLING_RATE: ${{ vars.CLIENT_ERROR_SAMPLING_RATE }}
          AI_PROVIDER_BASE_URL: ${{ vars.AI_PROVIDER_BASE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          FACEBOOK_CLIENT_ID: ${{ vars.FACEBOOK_CLIENT_ID }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
        run: npx tsx scripts/deploy/sync-wrangler-ids.ts .tf-outputs.json

      - name: Gate 3 - Apply Additive D1 Schema DDL (core, logs, blobs)
        run: |
          npx wrangler d1 execute mindkid-core --remote --file=.d1-ddl/core.sql
          npx wrangler d1 execute mindkid-logs --remote --file=.d1-ddl/logs.sql
          npx wrangler d1 execute mindkid-blobs --remote --file=.d1-ddl/blobs.sql

      - name: Gate 4 - Build Web (Nitro cloudflare_module) & Admin Static SPA & Verify Budget
        env:
          NUXT_PUBLIC_API_BASE_URL: "https://${{ vars.MINDKID_DOMAIN }}"
          NUXT_ALLOWED_ORIGINS: "https://${{ vars.MINDKID_DOMAIN }},https://admin.${{ vars.MINDKID_DOMAIN }}"
          # Nitro cloudflare_module bundle ~13 MB: heap mặc định của Node không đủ.
          NODE_OPTIONS: "--max-old-space-size=10240"
          # createWebEnv() chạy lúc `nuxt build` (nuxt.config nhập env.ts) với NODE_ENV=production
          # nên đòi đủ tập biến production — BR-ENV-15. INITIAL_ADMIN_* không cần lúc build (BR-ENV-16).
          NODE_ENV: production
          PORT: "3000"
          SITE_URL: "https://${{ vars.MINDKID_DOMAIN }}"
          STORAGE_BASE_URL: "https://${{ vars.MINDKID_DOMAIN }}"
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          PARENT_GATE_SECRET: ${{ secrets.PARENT_GATE_SECRET }}
          MFA_ENCRYPTION_KEY: ${{ secrets.MFA_ENCRYPTION_KEY }}
          STORAGE_SIGNING_SECRET: ${{ secrets.STORAGE_SIGNING_SECRET }}
          NUXT_NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${{ secrets.NUXT_NOTIFICATION_TOKEN_ENCRYPTION_KEY }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          PAYMENT_MODE: ${{ vars.PAYMENT_MODE }}
          PAYMENT_MERCHANT_ID: ${{ vars.PAYMENT_MERCHANT_ID }}
          VIETQR_BANK_ID: ${{ vars.VIETQR_BANK_ID }}
          VIETQR_BANK_NAME: ${{ vars.VIETQR_BANK_NAME }}
          VIETQR_ACCOUNT_NO: ${{ vars.VIETQR_ACCOUNT_NO }}
          VIETQR_ACCOUNT_NAME: ${{ vars.VIETQR_ACCOUNT_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          OPERATIONS_ALERT_EMAIL: ${{ vars.OPERATIONS_ALERT_EMAIL }}
        run: |
          pnpm build
          npx tsx scripts/deploy/verify-cf-budget.ts

      - name: Gate 5 - Deploy Worker Queue Consumer, Web Worker & Admin Static SPA
        run: |
          npx wrangler deploy --config apps/worker/wrangler.jsonc
          npx wrangler deploy --config apps/web/wrangler.jsonc
          npx wrangler deploy --config apps/admin/wrangler.jsonc

      - name: Gate 6 - Smoke Health Check & Auto-Rollback on Failure (BR-DEP-08)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.MINDKID_DOMAIN }}/api/guest/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke check failed with HTTP $STATUS. Rolling back Workers immediately..."
            npx wrangler rollback --config apps/web/wrangler.jsonc --yes
            npx wrangler rollback --config apps/worker/wrangler.jsonc --yes
            exit 1
          fi
          echo "✅ Smoke check 200 OK."
