name: CI

# ⏸ CI TẠM TẮT 2026-08-06 (quyết định người dùng).
# Trigger tự động bị comment; nội dung job giữ nguyên — bật lại = uncomment 4 dòng dưới.
# Giữ `workflow_dispatch` để file vẫn hợp lệ: workflow không có event nào bị GitHub
# báo "invalid workflow file" và gắn annotation đỏ lên repo. Đỏ giả dạy người ta bỏ
# qua màu, tệ hơn xanh giả.
#
# ⛔ `BR-RBS-03` VẪN CHẶN: phải bật lại + xanh remote TRƯỚC khi PR business logic
# đầu tiên mở. Xem docs/specs/00-foundation/repo-bootstrap.md §11 Q11.
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job này chỉ đọc code. Không khai thì GITHUB_TOKEN nhận default của org —
# có thể là read/write. Khai tường minh, ❌ NEVER để mặc định quyết định.
permissions:
  contents: read

jobs:
  check:
    name: Install, Check, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # BR-RBS-07 + SPEC.md §10 ("NEVER mock DB — dùng PG thật qua Docker").
    # Major version phải khớp docker-compose.yml và production.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kidthink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint + lint:tokens + lint:deps + typecheck.
      # lint:deps cưỡng chế BR-MPA-01/06/07 (monorepo-package-architecture §10).
      - name: Check
        run: pnpm check

      # repo-bootstrap §4 bước 5 — verify kết nối được TỪ NODE, và version đúng.
      - name: Verify services
        run: pnpm check:services

      # `check` KHÔNG chạy test (SPEC.md §7) — chạy riêng.
      - name: Test
        run: pnpm test

      # ❌ Chưa có step `pnpm build` (v1 có). Trên skeleton chưa có app thật,
      # build là no-op và đọc thành xanh giả. Thêm lại khi apps/web có code.
