# MindKid — hạ tầng dev cũ (chỉ còn Postgres, KHÔNG dùng: DB dev/test là SQLite `node:sqlite`).
# Valkey đã gỡ (D15): auth keyspace, rate limit, cache và queue chạy trong tiến trình trên SQLite.
#
#   docker compose up -d
#   psql -h localhost -p 5433 -U postgres -d mindkid
#
#

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # Bind loopback: app Node chạy trên host nên không cần lộ ra LAN.
    # "5433:5432" bind 0.0.0.0 — với creds postgres/postgres thì bất kỳ máy nào
    # cùng mạng cũng vào được.
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mindkid
    volumes:
      - pgdata_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

# ❌ Chưa có service S3 local (v1 dùng rustfs) — chưa spec nào ở bootstrap cần.
# Thêm khi `05-content`/`image-storage` tới, không trước.

volumes:
  pgdata_dev:
