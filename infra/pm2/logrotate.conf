# Log rotation for the web and worker processes.
# Spec: docs/specs/01-platform/process-supervision.md §7.2
# Rules: BR-SUP-06, BR-SRV-09 (a full disk takes the database down with it)
#
# Installed at /etc/logrotate.d/mindkid by `mindkid.sh provision`.

/var/log/mindkid/*/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    # Hard ceiling as well as a daily schedule: one bad day can fill a disk
    # long before the next rotation would have run.
    maxsize 200M
    create 0640 root root
    su root root
    sharedscripts
    postrotate
        # Without this the supervisor keeps writing to the rotated file
        # descriptor and the new file stays empty.
        pm2 reloadLogs >/dev/null 2>&1 || true
    endscript
}

/var/log/mindkid/deploy.log {
    weekly
    rotate 26
    compress
    missingok
    notifempty
    create 0640 root root
    su root root
}
