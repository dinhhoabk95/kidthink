# Datastores for the production host.
# Spec: docs/specs/01-platform/server-provisioning.md §7.2, §7.3
# Rules: BR-SRV-03 (loopback only), BR-SRV-05 (versions match development)
#
# Started by `mindkid.sh provision` with --env-file compose/datastore.env, which
# holds POSTGRES_PASSWORD and is written by hand, 0600 root:root.

services:
  postgres:
    # Same image line as docker-compose.yml on the development machine, and for
    # the same reason as the major version: migration 0000 runs
    # `CREATE EXTENSION vector`, which the stock postgres image cannot satisfy.
    # A stock image here means the first release on a blank host dies at step 7.
    image: pgvector/pgvector:pg17
    container_name: mindkid-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindkid}
      POSTGRES_USER: ${POSTGRES_USER:-mindkid}
      # No default: an unset password would start the database open.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in datastore.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mindkid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindkid} -d ${POSTGRES_DB:-mindkid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    # Major version 9, matching docker-compose.yml on the development machine.
    image: valkey/valkey:9-bookworm
    container_name: mindkid-valkey-prod
    restart: unless-stopped
    # `noeviction` is contractual, not a preference: infra/monitoring/alerts.yml
    # treats any other policy as P0. Auth and rate-limit state live here, and
    # silently dropping a key is a wrong answer rather than a slow one.
    # `maxmemory` bounds it: without a ceiling the cache grows until the host
    # OOM-kills whichever process the kernel picks, which is rarely this one.
    command: >
      valkey-server
      --appendonly yes
      --save 60 1
      --maxmemory ${VALKEY_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mindkid_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mindkid_pg_data:
    name: mindkid_prod_pg_data
  mindkid_valkey_data:
    name: mindkid_prod_valkey_data
