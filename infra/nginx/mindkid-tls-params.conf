# Shared TLS parameters, http context.
# Installed at /etc/nginx/conf.d/mindkid-tls-params.conf.
#
# Safe to install before any certificate exists: these directives configure how
# TLS is negotiated, they do not require a certificate to be present. That is
# what lets provisioning reach a valid nginx configuration on a blank host,
# which is the state certbot needs before it will do anything.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:MindKidTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
