# Sets $connection_upgrade for the proxy snippet: "upgrade" for a WebSocket
# handshake, "close" otherwise. A hardcoded `Connection: upgrade` on ordinary
# requests breaks keep-alive.
# Installed at /etc/nginx/conf.d/mindkid-upgrade-map.conf (http context).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
