# Rate limit zones, http context.
# Installed at /etc/nginx/conf.d/mindkid-limits.conf.
#
# These live here rather than in a site file because the site files are split
# per domain and per TLS state: a zone declared in three files is declared three
# times, and nginx refuses that.

limit_req_zone $binary_remote_addr zone=mindkid_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mindkid_auth:10m rate=5r/s;
