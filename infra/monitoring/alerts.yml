# ==============================================================================
# TiniMath / KidThink — Alert Rules & Threshold Definitions
# Contract: docs/specs/01-platform/monitoring-and-alerting.md §7.2
# ==============================================================================

version: "1.0"

groups:
  - name: P0
    description: "Critical severity — on-call alerted immediately via Telegram + Healthchecks + Email fallback (BR-MON-01, D-S)"
    rules:
      - name: HealthCheck503
        title: "Health check trả 503 hai lần liên tiếp"
        severity: critical
        threshold: "2 consecutive failures"
        channels:
          - telegram
          - healthchecks
        runbook: "https://docs.tinimath.vn/runbooks/health-503"
        enabled: true

      - name: RedisAuthFailure
        title: "Redis auth unavailable, write failure, hoặc lỗi Lua script"
        severity: critical
        threshold: "1 failure"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/redis-auth-failure"
        enabled: true

      - name: RedisAuthPressure
        title: "Redis auth memory pressure hoặc chính sách eviction khác noeviction"
        severity: critical
        threshold: "1 occurrence"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/redis-memory-pressure"
        enabled: true

      - name: RememberCredentialReuse
        title: "Phát hiện tái sử dụng remember credential — đã thu hồi toàn bộ phiên"
        severity: critical
        threshold: "1 occurrence"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/credential-reuse"
        enabled: true

      - name: ErrorRate5xx
        title: "Tỉ lệ lỗi 5xx vượt 5% trong 5 phút"
        severity: critical
        threshold: "> 5% in 5m"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/error-5xx"
        enabled: true

      - name: DatabaseDisconnected
        title: "Mất kết nối cơ sở dữ liệu PostgreSQL"
        severity: critical
        threshold: "immediate"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/db-disconnected"
        enabled: true

      - name: BackupFailed
        title: "Sao lưu cơ sở dữ liệu thất bại"
        severity: critical
        threshold: "immediate"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/backup-failed"
        enabled: true

      - name: BackupVerifyFailed
        title: "Kiểm tra khôi phục bản sao lưu (verify restore) thất bại"
        severity: critical
        threshold: "immediate"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/backup-verify-failed"
        enabled: true

      - name: WorkerBacklogHigh
        title: "Hàng đợi worker tồn đọng vượt 500 job trong 5 phút"
        severity: critical
        threshold: "> 500 jobs in 5m"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/worker-backlog"
        enabled: true

      - name: DiskSpaceLow
        title: "Dung lượng ổ cứng máy chủ còn dưới 15%"
        severity: critical
        threshold: "< 15% free"
        channels:
          - telegram
        runbook: "https://docs.tinimath.vn/runbooks/disk-low"
        enabled: true

  - name: P1
    description: "Warning / Business hours severity — alert via Email + Admin Dashboard (BR-MON-01)"
    rules:
      - name: ApiLatencyP95High
        title: "Độ trễ API P95 vượt 800ms trong 15 phút"
        severity: warning
        threshold: "> 800ms in 15m"
        channels:
          - email
          - dashboard
        runbook: "https://docs.tinimath.vn/runbooks/api-latency"
        enabled: true

      - name: JobFailRateHigh
        title: "Tỉ lệ job thất bại vượt 10 job / giờ"
        severity: warning
        threshold: "> 10/hour"
        channels:
          - email
          - dashboard
        runbook: "https://docs.tinimath.vn/runbooks/job-failures"
        enabled: true

      - name: PaymentQueuePending
        title: "Đơn hàng thanh toán chờ xử lý > 20 đơn hoặc đơn cũ nhất > 24 giờ"
        severity: warning
        threshold: "> 20 orders or oldest > 24h"
        channels:
          - email
          - dashboard
        runbook: "https://docs.tinimath.vn/runbooks/payment-queue"
        pending_source: "P2.3"
        enabled: true

      - name: ReviewQueueBacklog
        title: "Nội dung in_review tồn đọng vượt 50 mục"
        severity: warning
        threshold: "> 50 items in_review"
        channels:
          - email
          - dashboard
        runbook: "https://docs.tinimath.vn/runbooks/review-backlog"
        pending_source: "P2.8"
        enabled: true

      - name: LevelDropRateHigh
        title: "Tỉ lệ bỏ dở một game level vượt 40% trong 7 ngày"
        severity: warning
        threshold: "> 40% drop in 7d"
        channels:
          - email
          - dashboard
        runbook: "https://docs.tinimath.vn/runbooks/level-drop-rate"
        enabled: true

      - name: FeatureFlagStale
        title: "Feature flag tồn tại quá 30 ngày chưa dọn dẹp"
        severity: warning
        threshold: "> 30 days active"
        channels:
          - email
          - dashboard
        runbook: "https://docs.tinimath.vn/runbooks/stale-flags"
        pending_source: "P2.9"
        enabled: true

  - name: P2
    description: "Weekly summary report — sent weekly (BR-MON-01)"
    rules:
      - name: LowPlayLevelsReport
        title: "Báo cáo tổng hợp các game level có lượt chơi thấp"
        severity: info
        threshold: "< 10 plays / week"
        channels:
          - weekly_report
        runbook: "https://docs.tinimath.vn/runbooks/weekly-low-play"
        enabled: true

      - name: ContentGapReport
        title: "Báo cáo tổng hợp các skill thiếu nội dung (0 level published)"
        severity: info
        threshold: "0 published levels"
        channels:
          - weekly_report
        runbook: "https://docs.tinimath.vn/runbooks/weekly-content-gaps"
        enabled: true

      - name: CurriculumCoverageReport
        title: "Báo cáo tuần curriculum chưa đủ hoạt động"
        severity: info
        threshold: "< 5 activities in week"
        channels:
          - weekly_report
        runbook: "https://docs.tinimath.vn/runbooks/weekly-curriculum-coverage"
        enabled: true

      - name: LlmCostAccumulatedReport
        title: "Báo cáo chi phí LLM tích luỹ trong tuần"
        severity: info
        threshold: "weekly aggregate"
        channels:
          - weekly_report
        runbook: "https://docs.tinimath.vn/runbooks/weekly-llm-cost"
        enabled: true
