packages:
  - apps/*
  - packages/*

ignoreWorkspaceCycles: true
minimumReleaseAge: 0

# sharp: KHÔNG còn package nào của repo khai trực tiếp; `pnpm why sharp` (2026-11-25) chỉ còn
# đường bắc cầu wrangler -> miniflare. Giữ khai build script để `pnpm install` không exit 1
# (ERR_PNPM_IGNORED_BUILDS). Gỡ khi wrangler/miniflare thôi phụ thuộc sharp.
onlyBuiltDependencies:
  - sharp

# lefthook KHÔNG cần postinstall: binary tới từ optionalDependencies theo platform
# (`lefthook-darwin-x64` v.v.). Khai tường minh ở đây vì không khai thì
# `pnpm install` trên clone MỚI exit 1 (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  '@firebase/util': false
  esbuild: true
  lefthook: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  vue-demi: false
  workerd: false

# Chốt về MỘT bản duy nhất trong cây runtime (BR-RBS-09):
# - @opentelemetry/api: để drizzle-orm 1.0.0-rc.5 không sinh hai peer instance khác nhau.
# - unhead / @unhead/vue: để `useSeoMeta` gọi đúng vào head instance lúc SSR.
# - vue / @vue/shared: để Nuxt 4.6.4 không kéo song song vue 3.5 cạnh vue 3.6 RC.
overrides:
  "@biomejs/biome": 2.6.8
  "@opentelemetry/api": 1.10.0
  unhead: 3.4.3
  "@unhead/vue": 3.4.3
  vue: 3.6.0-rc.15
  "@vue/shared": 3.6.0-rc.15
