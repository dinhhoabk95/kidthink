packages:
  - apps/*
  - packages/*

ignoreWorkspaceCycles: true

# Catalog — nguồn version duy nhất cho dependency dùng chung (BR-RBS-06).
# Package con khai "catalog:", ❌ NEVER khai version rời.
#
# Chỉ liệt kê thứ ĐÃ cài ở bootstrap. Dòng còn lại của baseline
# (docs/specs/00-foundation/repo-bootstrap.md §7.1) thêm vào KHI package cần nó
# tới — pin trước cho thư viện chưa dùng chỉ tạo version chết.
catalog:
  # Tooling — xem plan.md D-H (lint) và D-I (TypeScript)
  "@biomejs/biome": ~2.6.8
  ultracite: ~8.2.1
  typescript: ~6.0.3
  "@types/node": ^26.6.6
  vitest: ^5.1.0
  "@vitest/coverage-v8": 5.1.0 # ghim CỨNG = bản vitest trong lockfile: peer của nó đòi vitest đúng cùng bản patch. Nâng vitest thì nâng dòng này cùng lúc — `pnpm test:coverage`
  happy-dom: ^21.0.4
  "@vitejs/plugin-vue": ^6.0.11
  "@vue/test-utils": ^2.6.0
  fast-check: ^4.10.2
  zod: ^4.6.7 # Zod 4 (Standard Schema) — id-conventions §7.1, BR-ID-05
  zod-to-json-schema: ^3.25.2
  dependency-cruiser: ^18.7.2 # cưỡng chế BR-MPA-01/06/07 trong gate local

  # Nuxt app runtime — P0.3. Pin the current 4.6 security-patched line.
  nuxt: ^4.6.4
  h3: ^1.15.11
  vue: ^3.5.45
  vue-tsc: ^3.3.14
  nitropack: ^2.13.6 # apps/web/server/error.ts import type NitroErrorHandler; bản Nuxt 4.6 đang kéo

  # UI Kit & Styling — Task 3 (BR-DSC-03, D-FE)
  "@nuxt/ui": ^4.12.2
  "@nuxt/fonts": ^1.2.0
  # Bộ icon local cho @nuxt/ui (mặc định của nó là lucide). Không có nó thì
  # Nuxt Icon đi lấy icon qua api.iconify.design lúc chạy — CSP của apps/web
  # là `default-src 'self'` nên ở production icon chết câm.
  "@iconify-json/lucide": ^1.2.155
  tailwindcss: ^4.3.5

  # Accessibility & Browser Testing — Task 4 (BR-A11-01)
  "@playwright/test": ^1.65.1
  "@axe-core/playwright": ^4.14.0
  playwright: 1.65.1

  # Auth — Task #85: nuxt-auth-utils >=0.5.30 for opaque session locator projection
  "nuxt-auth-utils": ^0.6.2
  otpauth: ^9.6.0
  openid-client: ^6.9.0

  # Notification & Security Core Packages — Task #83
  nodemailer: ^10.6.0
  "@types/nodemailer": ^8.0.2
  mjml: ^5.4.1
  "@types/mjml": ^5.4.2
  rate-limiter-flexible: ^11.5.0
  nuxt-security: ^2.7.0
  "@t3-oss/env-nuxt": ^0.13.11

  # FCM Web Push — Task #84
  firebase: ^13.3.0
  firebase-admin: ^14.5.1

  # Driver hạ tầng — hiện chỉ scripts/check-services.ts dùng (repo-bootstrap §4
  # bước 5: "verify kết nối được từ Node"). Chuyển vào packages/db và
  # packages/cache khi hai package đó được dựng thật.
  postgres: ^4.1.1 # driver postgres.js, không phải node-postgres
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  ioredis: ^6.0.0
  bullmq: ^6.7.6
  # apps/worker gói thành một file dist/index.js: các package workspace export
  # TS thô nên `tsc` không dựng được output phẳng (BR-SUP-09 cấm chạy TS qua loader).
  esbuild: ^0.28.2
  # tsx — runner TS cho script vận hành (`pnpm services`, `pnpm deploy`,
  # `db:migrate`, `db:seed`). Cấm — NEVER khai version rời ở package con: gốc và
  # apps/worker cùng gọi nó, hai bản pin lệch là hai runtime TS khác nhau.
  tsx: ^4.23.15
  # argon2 — hash mật khẩu (auth-tokens-sessions.md §1). Từng khai `^0.45.1` rời
  # ở CẢ packages/auth và apps/worker; bump một chỗ là chạy hai bản native
  # addon trong cùng một process.
  argon2: ^0.45.2
  sharp: ^0.35.5
  lefthook: ^2.2.2

onlyBuiltDependencies:
  - sharp

# lefthook KHÔNG cần postinstall: binary tới từ optionalDependencies theo platform
# (`lefthook-darwin-x64` v.v.). Đo được: `ignoredBuilds: [lefthook@2.1.10]` trong
# .modules.yaml mà `lefthook version` vẫn chạy.
# Khai tường minh ở đây vì không khai thì `pnpm install` trên clone MỚI exit 1
# (ERR_PNPM_IGNORED_BUILDS) — vỡ onboarding. Xem repo-bootstrap §7.1.
allowBuilds:
  '@firebase/util': false
  argon2: true
  esbuild: true
  lefthook: false
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  vue-demi: false

# unhead phải là MỘT bản duy nhất trong cây. nuxt 4.6.4 khai `unhead: ^3.4.3`
# còn @nuxt/ui 4.12.2 khai `@unhead/vue: ^3.4.3`; lockfile chốt về cùng một bản
# để `useSeoMeta` gọi đúng vào head instance lúc SSR.
overrides:
  "@biomejs/biome": 2.6.8
  unhead: 3.4.3
  "@unhead/vue": 3.4.3

minimumReleaseAgeExclude:
  - '@nuxt/fonts@1.2.0'
  - '@types/mjml@5.4.1'
  - bullmq@6.4.2
  - "@biomejs/biome@2.6.8"
  - "@biomejs/cli-android-arm64@2.6.8"
  - "@biomejs/cli-android-x64@2.6.8"
  - "@biomejs/cli-darwin-arm64@2.6.8"
  - "@biomejs/cli-darwin-x64@2.6.8"
  - "@biomejs/cli-linux-arm64-musl@2.6.8"
  - "@biomejs/cli-linux-arm64@2.6.8"
  - "@biomejs/cli-linux-x64-musl@2.6.8"
  - "@biomejs/cli-linux-x64@2.6.8"
  - "@biomejs/cli-win32-arm64@2.6.8"
  - "@biomejs/cli-win32-x64@2.6.8"
  - "@nuxt/ui@4.12.2"
  - nodemailer@10.6.0
  - rate-limiter-flexible@11.5.0
