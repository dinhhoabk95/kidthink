# Gate local duy nhất: Biome trên file staged (BR-RBS-03). Không pre-push.
# `pnpm check` và vitest của workspace chạy tay trước khi xong việc.
#
# ⛔ `git commit --no-verify` BỎ QUA hook này — lefthook là gate local, không phải cưỡng chế server-side.

# skip_lfs: repo không dùng Git LFS.
skip_lfs: true

pre-commit:
  jobs:
    - name: biome-staged
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,vue,json,jsonc,css}"
      stage_fixed: true
      run: ./node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
