# Gate chất lượng — chạy LOCAL, không có CI remote (repo-bootstrap.md §7.1, §11 Q5).
#
# Phân tầng có chủ đích:
#   pre-commit  = nhanh (format staged + lint + ranh giới package) → không làm commit chậm tới mức người ta bỏ qua
#   pre-push    = (Tạm thời vô hiệu hóa — dự án chuyển sang manual test)
#
# Gộp `check` vào pre-commit là đổi chỗ, không phải bỏ bớt: `check` tự chạy lại
# `lint` và `lint:deps`, nên mỗi commit đo hai lần.
#
# Cổng lint tuỳ biến (`packages/gates`) đã bị gỡ. Lint chỉ còn Biome (`pnpm lint`),
# ranh giới package (`pnpm lint:deps`) và vue-tsc/tsc (`pnpm typecheck`).
#
# ⚠️ Lưu ý: Các bước chạy automated test (unit/integration/e2e) tạm thời tắt,
# chuyển sang kiểm thử thủ công (manual testing).
#
# ⛔ `git commit --no-verify` / `git push --no-verify` BỎ QUA hook này.
# lefthook là gate local, ❌ KHÔNG phải cưỡng chế server-side. Xem repo-bootstrap §11 Q12.

# skip_lfs: bỏ qua Git LFS hooks (repo không dùng LFS, tránh lefthook cảnh báo/lỗi thừa).
skip_lfs: true

pre-commit:
  parallel: false
  jobs:
    # Định dạng + fix an toàn TRƯỚC khi lint đo. `stage_fixed` stage lại file đã
    # sửa, nên commit chứa đúng bản đã định dạng — không có vòng "commit đỏ vì
    # thiếu dấu cách, sửa, commit lại".
    #
    # Chỉ chạm {staged_files}: chạy `--write` trên cả cây sẽ nuốt thay đổi dở
    # của người khác vào commit này.
    - name: format
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,vue,json,jsonc,css}"
      stage_fixed: true
      run: |
        [ -d "${HOME}/.nvm/versions/node/v24.15.0/bin" ] && export PATH="${HOME}/.nvm/versions/node/v24.15.0/bin:$PATH"
        pnpm exec biome check --write --no-errors-on-unmatched {staged_files}

    # Cổng thật vẫn là lượt đo trên toàn cây: `--write` chỉ sửa được thứ Biome
    # coi là an toàn, phần còn lại phải đỏ ở đây.
    # lint + deps chạy song song (không phụ thuộc nhau), tiết kiệm ~2s.
    - name: lint-and-deps
      run: |
        [ -d "${HOME}/.nvm/versions/node/v24.15.0/bin" ] && export PATH="${HOME}/.nvm/versions/node/v24.15.0/bin:$PATH"
        pnpm lint &
        PID_LINT=$!
        pnpm lint:deps &
        PID_DEPS=$!
        FAIL=0
        wait $PID_LINT || FAIL=1
        wait $PID_DEPS || FAIL=1
        exit $FAIL

    # Cổng đối chiếu engine — Task #263 (T1), chạy song song, chỉ khi chạm engine/corpus.
    # Dựng sẵn chỗ cho #261 (check:engine-behavior) và #262 (check:engine-turn).
    # ⚠️ Điểm mù (BR-CFO-10): Job này gắn glob, CHỈ chạy khi commit đụng 4 cây thư mục khai báo ở glob.
    # Các commit chỉ đổi scripts/, packages/db/config/, packages/config/, hoặc docs/ khác sẽ BỎ QUA
    # toàn bộ engine-gates ở pre-commit. Cổng toàn diện bắt buộc là scripts/check.sh.
    - name: engine-gates
      glob: "{docs/specs/01-platform/engines/**,docs/specs/05-content/**,packages/game-engine/src/**,packages/game-engine/config/**,packages/content/src/**,packages/content-build/src/**}"
      run: |
        NODE_DIR="${HOME}/.nvm/versions/node/v24.15.0/bin"
        if [ -d "$NODE_DIR" ]; then
          export PATH="$NODE_DIR:$PATH"
        else
          NVM_NODE_DIR="${NVM_DIR:-${HOME}/.nvm}/versions/node"
          if [ -d "${NVM_NODE_DIR}" ]; then
            for candidate in $(ls -1 "${NVM_NODE_DIR}" 2>/dev/null | grep "^v24\." | sort -V -r); do
              candidate_bin="${NVM_NODE_DIR}/${candidate}/bin"
              if [ -x "${candidate_bin}/node" ]; then
                export PATH="${candidate_bin}:${PATH}"
                break
              fi
            done
          fi
        fi

        TSX="./node_modules/.bin/tsx"

        # Cấm — NEVER bọc lệnh nền trong `cmd || { ...; FAIL=1; }`: nhánh `||`
        # chạy THÀNH CÔNG nên subshell nền thoát 0, `wait` đọc được 0, và gán
        # FAIL=1 nằm trong subshell không về được tiến trình cha. Cổng đỏ khi ấy
        # lọt qua im lặng. Chạy trần, để `wait` đọc đúng mã thoát.
        run_gate() {
          $TSX "$1" &
        }

        run_gate packages/game-engine/scripts/check-engine-specs.ts
        PID_SPECS=$!

        run_gate packages/game-engine/scripts/check-render.ts
        PID_RENDER=$!

        run_gate packages/content-build/src/cli/check-engine-depth.ts
        PID_DEPTH=$!

        # Chỗ dựng sẵn cho #261 (check:engine-behavior) và #262 (check:engine-turn)
        run_gate packages/game-engine/scripts/check-engine-turn.ts
        PID_TURN=$!

        run_gate packages/game-engine/scripts/check-engine-behavior.ts
        PID_BEHAVIOR=$!

        # Cổng độ khó và tham số cứng — Task #263 T6 (BR-LDC-01..06)
        run_gate packages/game-engine/scripts/check-difficulty-ladder.ts
        PID_LADDER=$!

        run_gate packages/game-engine/scripts/check-hardcoded-params.ts
        PID_HARDCODED=$!

        # Cổng ma trận seed mục 13 — Task #263 T13 (BR-CSM-03)
        run_gate packages/content-build/src/cli/check-engine-seed-matrix.ts
        PID_SEED_MATRIX=$!

        FAIL=0
        for entry in \
          "$PID_SPECS:check:engine-specs" \
          "$PID_RENDER:check:render" \
          "$PID_DEPTH:check:engine-depth" \
          "$PID_TURN:check:engine-turn" \
          "$PID_BEHAVIOR:check:engine-behavior" \
          "$PID_LADDER:check:difficulty-ladder" \
          "$PID_HARDCODED:check:hardcoded-params" \
          "$PID_SEED_MATRIX:check:engine-seed-matrix"; do
          pid="${entry%%:*}"
          name="${entry#*:}"
          if ! wait "$pid"; then
            echo "✗ ${name} failed" >&2
            FAIL=1
          fi
        done

        exit $FAIL

pre-push:
  parallel: false
  jobs:
    - name: check
      run: |
        [ -d "${HOME}/.nvm/versions/node/v24.15.0/bin" ] && export PATH="${HOME}/.nvm/versions/node/v24.15.0/bin:$PATH"
        pnpm check:fast
