    stroke-linecap="round"
    stroke-width="3"
  />
  <!-- Sparkle -->
  <path
    d="M100 18l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"
    fill="#fde68a"
