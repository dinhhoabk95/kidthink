<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Mascot Bear Wonder</title>
  <!-- Mascot Bear: Wonder / Searching -->
  <circle
    cx="60"
    cy="65"
    fill="#d97706"
    r="38"
    stroke="#92400e"
    stroke-width="4"
  />
  <!-- Ears -->
  <circle
    cx="36"
    cy="36"
    fill="#d97706"
    r="14"
    stroke="#92400e"
    stroke-width="4"
  />
  <circle cx="36" cy="36" fill="#fde68a" r="7" />
  <circle
    cx="84"
    cy="36"
    fill="#d97706"
    r="14"
    stroke="#92400e"
