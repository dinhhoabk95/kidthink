  <ellipse cx="60" cy="79" fill="#451a03" rx="3.5" ry="4" />
  <!-- Eyes: wide with highlights -->
  <circle cx="47" cy="56" fill="#1c1917" r="6" />
  <circle cx="73" cy="56" fill="#1c1917" r="6" />
  <circle cx="49" cy="54" fill="#fffbeb" r="2" />
  <circle cx="75" cy="54" fill="#fffbeb" r="2" />
