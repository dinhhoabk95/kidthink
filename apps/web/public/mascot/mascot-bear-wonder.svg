  />
  <circle cx="84" cy="36" fill="#fde68a" r="7" />
  <!-- Muzzle -->
  <ellipse
    cx="60"
    cy="74"
    fill="#fffbeb"
    rx="18"
    ry="13"
    stroke="#92400e"
    stroke-width="3"
  />
  <ellipse cx="60" cy="68" fill="#451a03" rx="6" ry="4" />
