<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Bóng bay</title>
  <defs>
    <radialGradient cx="35%" cy="30%" id="balloonBody" r="68%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="42%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>
  </defs>
  <!-- String -->
  <path
    d="M60 88C64 95 54 100 59 109"
