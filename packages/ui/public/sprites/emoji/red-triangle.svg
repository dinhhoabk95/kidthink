<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Hình tam giác đỏ</title>
  <defs>
    <linearGradient id="triBlock" x1="25%" x2="85%" y1="15%" y2="90%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="48%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- 2.5D wooden block extrusion -->
  <path
    d="M60 22L104 97C106 101 103 106 98 106H22C17 106 14 101 16 97L60 22Z"
