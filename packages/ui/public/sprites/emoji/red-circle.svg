<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Hình tròn đỏ</title>
  <defs>
    <radialGradient cx="36%" cy="32%" id="redDisc" r="68%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
  </defs>
  <!-- 2.5D wooden block extrusion -->
  <circle
    cx="60"
    cy="65"
    fill="#991b1b"
    r="44"
    stroke="#7f1d1d"
    stroke-width="4"
  />
  <!-- Main lacquered wooden face -->
  <circle
    cx="60"
    cy="57"
    fill="url(#redDisc)"
    r="44"
    stroke="#7f1d1d"
    stroke-width="4"
  />
  <!-- Montessori bevel ring -->
  <circle
    cx="60"
    cy="57"
    r="35"
    stroke="#fecaca"
    stroke-opacity="0.55"
    stroke-width="2.5"
  />
  <!-- Specular highlight -->
  <path
    d="M33 41C39 30 51 24 64 24"
    stroke="#ffffff"
    stroke-linecap="round"
    stroke-opacity="0.55"
    stroke-width="5"
  />
  <circle cx="31" cy="51" fill="#ffffff" fill-opacity="0.5" r="2.8" />
</svg>
