<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Ô tô</title>
  <defs>
    <linearGradient id="carBody" x1="20%" x2="80%" y1="15%" y2="85%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="carGlass" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="60" cy="95" fill="#78350f" opacity="0.22" rx="44" ry="7" />
