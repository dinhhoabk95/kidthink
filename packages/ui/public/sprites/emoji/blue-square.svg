<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Hình vuông xanh</title>
  <defs>
    <linearGradient id="blueBlock" x1="15%" x2="85%" y1="15%" y2="85%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- 2.5D wooden block extrusion -->
  <rect
    fill="#1e40af"
    height="82"
    rx="18"
    stroke="#1e3a8a"
    stroke-width="4"
    width="86"
    x="17"
    y="23"
  />
  <!-- Front beveled face -->
  <rect
    fill="url(#blueBlock)"
    height="82"
    rx="18"
    stroke="#1e3a8a"
    stroke-width="4"
    width="86"
    x="17"
    y="15"
  />
  <!-- Inner Montessori bevel -->
  <rect
    height="66"
    rx="12"
    stroke="#bfdbfe"
    stroke-opacity="0.55"
    stroke-width="2.5"
    width="70"
    x="25"
    y="23"
  />
  <!-- Specular highlight -->
  <path
    d="M30 27H58"
    stroke="#ffffff"
    stroke-linecap="round"
    stroke-opacity="0.55"
    stroke-width="4.5"
  />
  <circle cx="27" cy="36" fill="#ffffff" fill-opacity="0.5" r="2.5" />
</svg>
