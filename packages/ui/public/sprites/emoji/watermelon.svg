<svg fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <title>Dưa hấu</title>
  <defs>
    <linearGradient id="melonFlesh" x1="30%" x2="70%" y1="15%" y2="85%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="melonRind" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- 2.5D thick rind depth shadow -->
  <path
    d="M16 48C16 83 36 107 60 107C84 107 104 83 104 48Z"
    fill="#14532d"
    opacity="0.38"
  />
  <!-- Outer green rind -->
  <path
    d="M15 43C15 77 35 101 60 101C85 101 105 77 105 43H15Z"
    fill="url(#melonRind)"
    stroke="#14532d"
    stroke-linejoin="round"
    stroke-width="4"
  />
  <!-- Pale inner pith -->
  <path d="M22 43C22 71 39 92 60 92C81 92 98 71 98 43H22Z" fill="#ecfdf5" />
  <!-- Juicy red flesh -->
  <path
    d="M27 43C27 67 42 86 60 86C78 86 93 67 93 43H27Z"
    fill="url(#melonFlesh)"
    stroke="#991b1b"
    stroke-linejoin="round"
    stroke-width="3.5"
  />
  <!-- Seeds -->
  <ellipse
    cx="44"
    cy="56"
    fill="#451a03"
    rx="2.5"
    ry="4"
    transform="rotate(-18 44 56)"
  />
  <ellipse cx="60" cy="54" fill="#451a03" rx="2.5" ry="4" />
  <ellipse
    cx="76"
    cy="56"
    fill="#451a03"
    rx="2.5"
    ry="4"
    transform="rotate(18 76 56)"
  />
  <ellipse
    cx="52"
    cy="70"
    fill="#451a03"
    rx="2.4"
    ry="3.8"
    transform="rotate(-10 52 70)"
  />
  <ellipse
    cx="68"
    cy="70"
    fill="#451a03"
    rx="2.4"
    ry="3.8"
    transform="rotate(10 68 70)"
  />
  <!-- Specular highlight -->
  <path
    d="M35 49H62"
    stroke="#ffffff"
    stroke-linecap="round"
    stroke-opacity="0.45"
    stroke-width="4.5"
  />
</svg>
